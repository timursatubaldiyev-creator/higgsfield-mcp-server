<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Личный кабинет — Меридиан</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .cabinet-wrap{ max-width:560px; margin:0 auto; padding:4.5rem 28px 6rem; }
  .auth-tabs{ display:flex; gap:.6rem; margin-bottom:1.6rem; }
  .auth-tabs button{ flex:1; padding:.8em; border-radius:12px; border:1px solid var(--line); background:var(--paper); font-weight:600; }
  .auth-tabs button.active{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:1.8rem; box-shadow:var(--shadow); margin-bottom:1.6rem; }
  .auth-form{ display:flex; flex-direction:column; gap:.8rem; }
  .hidden{ display:none !important; }
  .dash-balance{ text-align:center; padding:1.6rem 0; }
  .dash-balance strong{ font-family:var(--font-display); font-size:2.6rem; color:var(--terracotta); display:block; }
  .lead-item{ border-bottom:1px solid var(--line); padding:.9rem 0; font-size:.9rem; }
  .lead-item:last-child{ border-bottom:none; }
  .lead-status{ display:inline-block; font-size:.72rem; font-weight:700; padding:.2em .6em; border-radius:999px; background:var(--cream-deep); margin-left:.4rem; }
  .lead-status.completed{ background:var(--teal); color:#fff; }
  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
  .top-bar a{ font-weight:600; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="cabinet-wrap">
  <div class="top-bar">
    <a href="/">← На главную</a>
    <button class="btn btn-ghost hidden" id="logoutBtn">Выйти</button>
  </div>

  <h1 style="font-family:var(--font-display);">Личный кабинет</h1>

  <div id="authBlock">
    <div class="auth-tabs">
      <button id="tabLogin" class="active">Вход</button>
      <button id="tabRegister">Регистрация</button>
    </div>

    <div class="card">
      <form class="auth-form" id="loginForm">
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Пароль" required />
        <button class="btn btn-primary" type="submit">Войти</button>
        <p class="form-note" id="loginNote"></p>
      </form>
      <form class="auth-form hidden" id="registerForm">
        <input name="name" placeholder="Имя" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="phone" placeholder="Телефон" />
        <input name="password" type="password" placeholder="Пароль (мин. 6 символов)" minlength="6" required />
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
        <p class="form-note" id="registerNote"></p>
      </form>
    </div>
  </div>

  <div id="dashBlock" class="hidden">
    <div class="card dash-balance">
      <span style="text-transform:uppercase;font-size:.75rem;letter-spacing:.08em;color:var(--ink-soft)">Бонусный баланс</span>
      <strong id="balanceValue">0</strong>
      <span style="font-size:.85rem;color:var(--ink-soft)">баллов · 1 балл = 1 бонусный $</span>
    </div>

    <div class="card">
      <h3 style="font-family:var(--font-display);margin-bottom:1rem;">Мои заявки</h3>
      <div id="leadsList"><p style="color:var(--ink-soft);font-size:.9rem;">Заявок пока нет — оставьте первую на главной странице.</p></div>
    </div>
  </div>
</div>

<script src="/js/cabinet.js"></script>
</body>
</html>
